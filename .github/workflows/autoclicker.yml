name: Tapflow (Android auto clicker)

on:
  push:
    paths:
      - "AutoClicker/**"
      - ".github/workflows/autoclicker.yml"
  workflow_dispatch:

concurrency:
  group: tapflow-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: AutoClicker

jobs:
  build:
    name: Test & build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core engine)
        run: ./gradlew --no-daemon :core:test
      - name: Build debug + release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/tapflow-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/tapflow-release.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: tapflow-apk
          path: AutoClicker/out/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: AutoClicker/core/build/reports/tests/

  screenshots:
    name: Emulator screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tapflow-apk
          path: AutoClicker/out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: AutoClicker
          script: bash ci/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tapflow-screenshots
          path: AutoClicker/screenshots/
      - name: Publish screenshots to the branch (for the README)
        if: github.event_name == 'push'
        run: |
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*
          pip install --quiet pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for f in sorted(glob.glob("screenshots/[0-9]*.png")):
              im = Image.open(f).convert("RGB")
              im = im.resize((540, im.height * 540 // im.width), Image.LANCZOS)
              im.save("docs/screenshots/" + os.path.basename(f)[:-4] + ".jpg", quality=86)
          PY
          ls -la docs/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update Tapflow screenshots [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
